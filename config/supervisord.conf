[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:named]
command=/usr/sbin/named -f -u bind -c /etc/bind/named.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/named-stdout.log
stderr_logfile=/var/log/supervisor/named-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:bind9-panel]
command=/app/server
directory=/app
autostart=true
autorestart=true
environment=PORT="8890",DATA_DIR="/app/data",BACKUP_DIR="/app/backups",NAMED_CONF="/etc/bind/named.conf"
stdout_logfile=/var/log/supervisor/panel-stdout.log
stderr_logfile=/var/log/supervisor/panel-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
