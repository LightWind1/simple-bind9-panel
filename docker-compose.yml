services:
  bind9-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bind9-panel
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      # 持久化数据
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      - PORT=8890
      - DATA_DIR=/app/data
      - BACKUP_DIR=/app/backups
      - NAMED_CONF=/etc/bind/named.conf
    restart: unless-stopped
